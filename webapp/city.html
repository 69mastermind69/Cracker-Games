<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#10051c">
  <title>Neon City • Cracker Games</title>
  <link rel="stylesheet" href="city.css">
</head>
<body>
  <div class="hud">
    <div class="brand"><span>🌴</span><b>NEON CITY</b></div>
    <div class="stats">
      <span>💵 <b id="cash">500</b></span>
      <span>⭐ <b id="rep">0</b></span>
      <span>🏠 <b id="property">0</b></span>
    </div>
  </div>

  <main>
    <canvas id="cityCanvas" width="960" height="600"></canvas>
    <div class="mission" id="mission">Explore the city. Walk to the blue marker to begin your first delivery.</div>
    <div class="controls">
      <button data-key="ArrowLeft">◀</button>
      <div><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button></div>
      <button data-key="ArrowRight">▶</button>
      <button id="action">✨ Action</button>
    </div>
  </main>

  <div class="panel hidden" id="panel">
    <h2 id="panelTitle">Neon City</h2>
    <p id="panelText"></p>
    <div id="panelButtons"></div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="city.js"></script>
</body>
</html>
