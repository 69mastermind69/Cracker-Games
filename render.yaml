services:
  - type: web
    name: telegram-gaming-bot
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: python app.py

    healthCheckPath: /health

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: WEBHOOK_URL
        sync: false

      - key: PYTHON_VERSION
        value: 3.13.5
