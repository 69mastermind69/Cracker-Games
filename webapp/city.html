<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#090b16"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>Cracker City • Cracker Games</title>

    <link
        rel="stylesheet"
        href="city.css"
    >
</head>

<body>

    <!-- =====================================================
         TOP HUD
         ===================================================== -->

    <header class="hud">

        <div class="brand">
            <span>🏙️</span>
            <b>CRACKER CITY</b>
        </div>

        <div class="stats">

            <span>
                💵
                <b id="cash">500</b>
            </span>

            <span>
                ⭐
                <b id="rep">0</b>
            </span>

            <span>
                🏠
                <b id="property">0</b>
            </span>

        </div>

    </header>


    <!-- =====================================================
         GAME AREA
         ===================================================== -->

    <main>

        <canvas
            id="cityCanvas"
            width="960"
            height="600"
        ></canvas>


        <!-- Mission / status text -->

        <div
            class="mission"
            id="mission"
        >
            Explore Cracker City and find your first mission.
        </div>


        <!-- =================================================
             MOBILE CONTROLS
             ================================================= -->

        <div class="controls">

            <button
                type="button"
                data-key="ArrowLeft"
                aria-label="Move left"
            >
                ◀
            </button>


            <div>

                <button
                    type="button"
                    data-key="ArrowUp"
                    aria-label="Move up"
                >
                    ▲
                </button>

                <button
                    type="button"
                    data-key="ArrowDown"
                    aria-label="Move down"
                >
                    ▼
                </button>

            </div>


            <button
                type="button"
                data-key="ArrowRight"
                aria-label="Move right"
            >
                ▶
            </button>


            <button
                type="button"
                id="action"
                aria-label="Action"
            >
                ✨ Action
            </button>

        </div>

    </main>


    <!-- =====================================================
         INTERACTION PANEL
         ===================================================== -->

    <section
        class="panel hidden"
        id="panel"
        aria-hidden="true"
    >

        <h2 id="panelTitle">
            Cracker City
        </h2>

        <p id="panelText">
        </p>

        <div id="panelButtons">
        </div>

    </section>


    <!-- =====================================================
         TELEGRAM WEB APP
         ===================================================== -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <!-- =====================================================
         CRACKER CITY GAME
         ===================================================== -->

    <script src="city.js"></script>

</body>
</html>
